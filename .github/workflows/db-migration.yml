name: Database Migration

on:
  workflow_call:
    inputs:
      image_uri:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECS_CLUSTER: connecto
  MIGRATION_TASK_DEFINITION: connecto-migration

  ECS_SUBNET_1: subnet-03fd731af61c75191
  ECS_SUBNET_2: subnet-052e606e7862c3bf9
  ECS_SUBNET_3: subnet-02b3199deca27b328

  ECS_SECURITY_GROUP: YOUR_ECS_SECURITY_GROUP_ID

jobs:
  migrate:
    name: Run EF Core Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migration
        run: |
          set -e

          TASK_ARN=$(aws ecs run-task  --cluster "$ECS_CLUSTER"  --task-definition "$MIGRATION_TASK_DEFINITION"  --launch-type FARGATE \
            --network-configuration  "awsvpcConfiguration={subnets=[$ECS_SUBNET_1,$ECS_SUBNET_2,$ECS_SUBNET_3],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn'  --output text)

          echo "Migration task started:"
          echo "$TASK_ARN"

          aws ecs wait tasks-stopped  --cluster "$ECS_CLUSTER"  --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks  --cluster "$ECS_CLUSTER"  --tasks "$TASK_ARN"  --query 'tasks[0].containers[0].exitCode'  --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed."
            exit 1
          fi

          echo "Database migration completed successfully."