name: Deployment

on:
  workflow_call:
    inputs:
      image_uri:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECS_CLUSTER: connecto
  ECS_SERVICE: connecto-api-tcek4m-service-v490e2cr
  ECS_TASK_DEFINITION: connecto-task-definition-tcek4m
  CONTAINER_NAME: Main

jobs:
  deploy:
    name: Deploy API to ECS
    runs-on: ubuntu-latest
    
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition  --task-definition "$ECS_TASK_DEFINITION"  --query taskDefinition  --output json > downloaded-task-definition.json
          jq '.containerDefinitions |= map(.environment = ((.environment // []) | map(select(.name != "ConnectionStrings__DefaultConnection"))) | .secrets = ((.secrets // []) | map(select(.name != "ConnectionStrings__DefaultConnection"))))' downloaded-task-definition.json > task-definition.json

      - name: Check Cognito configuration
        env:
          DATABASE_SERVER: ${{ vars.DATABASE_SERVER }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          DATABASE_CREDENTIALS_SECRET_ARN: ${{ vars.DATABASE_CREDENTIALS_SECRET_ARN }}
        run: |
          test -n "$DATABASE_SERVER" && test -n "$DATABASE_NAME" && test -n "$DATABASE_CREDENTIALS_SECRET_ARN"

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ inputs.image_uri }}
          environment-variables: |
            Database__Server=${{ vars.DATABASE_SERVER }}
            Database__Name=${{ vars.DATABASE_NAME }}
          secrets: |
            Database__Username=${{ vars.DATABASE_CREDENTIALS_SECRET_ARN }}:username::
            Database__Password=${{ vars.DATABASE_CREDENTIALS_SECRET_ARN }}:password::

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
