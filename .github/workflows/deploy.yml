name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_migration:
        description: "Run EF Core database migration"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: connecto-production-deployment
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  database-migration:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.run_migration == true }}
    uses: ./.github/workflows/db-migration.yml
    with:
      image_uri: ${{ needs.build.outputs.image_uri }}
    secrets: inherit

  deployment:
    needs:
      - build
      - database-migration
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.database-migration.result == 'success' ||
       needs.database-migration.result == 'skipped')
    uses: ./.github/workflows/deployment.yml
    with:
      image_uri: ${{ needs.build.outputs.image_uri }}
    secrets: inherit
