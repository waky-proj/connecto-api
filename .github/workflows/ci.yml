name: CI Build And Test

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      
  workflow_dispatch:
      inputs:
        environment:
          description: "CI Build"
          required: true
          type: choice
          options:
            - production

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Connecto.Api/Connecto.Api.slnx

      - name: Build
        run: dotnet build Connecto.Api/Connecto.Api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Connecto.Api/Connecto.Api.slnx --configuration Release --no-build --verbosity normal